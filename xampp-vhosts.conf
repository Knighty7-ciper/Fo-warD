# Apache Virtual Host Configuration for Forward LMS
# Add this to xampp/apache/conf/extra/httpd-vhosts.conf

<VirtualHost *:80>
    ServerName forward.local
    ServerAlias www.forward.local
    DocumentRoot "C:/xampp/htdocs/forward"

    <Directory "C:/xampp/htdocs/forward">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/forward-error.log"
    CustomLog "logs/forward-access.log" common
</VirtualHost>

# For SSL (optional)
<VirtualHost *:443>
    ServerName forward.local
    ServerAlias www.forward.local
    DocumentRoot "C:/xampp/htdocs/forward"

    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"

    <Directory "C:/xampp/htdocs/forward">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/forward-ssl-error.log"
    CustomLog "logs/forward-ssl-access.log" common
</VirtualHost>
