; PHP Configuration for Forward LMS
; Place this in your XAMPP php/php.ini or reference it in your virtual host

[PHP]
; Error handling
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = "logs/php_error.log"

; File uploads
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20

; Execution limits
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Session settings
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; Security
allow_url_fopen = On
allow_url_include = Off
expose_php = Off

; Extensions (ensure these are enabled)
extension=mysqli
extension=pdo_mysql
extension=pdo_pgsql
extension=curl
extension=gd
extension=mbstring
extension=openssl
extension=fileinfo
extension=zip

; Date/Time
date.timezone = "UTC"
